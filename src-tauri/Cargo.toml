[package]
name = "planetarium-editor"
version = "0.1.0"
description = "Planetarium spatial wallpaper editor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
axum = "0.7"
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
include_dir = "0.7"
mime_guess = "2"
url = "2"
percent-encoding = "2"
dirs = "5"
open = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
